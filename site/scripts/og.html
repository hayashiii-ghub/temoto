<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1200, initial-scale=1" />
    <title>temoto — Less friction. More doing.</title>
    <style>
      @font-face {
        font-family: "Inter";
        src: url("../public/brand/Inter-Bold.ttf") format("truetype");
        font-style: normal;
        font-weight: 700;
        font-display: block;
      }

      @font-face {
        font-family: "Geist";
        src: url("../public/brand/Geist-Variable.woff2") format("woff2");
        font-style: normal;
        font-weight: 100 900;
        font-display: block;
      }

      * { box-sizing: border-box; }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
        background: #9974f8;
        color: #080808;
        font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-synthesis: none;
        -webkit-font-smoothing: antialiased;
      }

      main {
        position: relative;
        width: 1200px;
        height: 630px;
        background: #9974f8;
      }

      .lower-field {
        position: absolute;
        inset: 474px 0 0;
        background: #080808;
      }

      .brand {
        position: absolute;
        top: 42px;
        left: 64px;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 40px;
        font-weight: 650;
        line-height: 1;
        letter-spacing: -0.055em;
      }

      .brand img {
        display: block;
        width: 40px;
        height: 40px;
        filter: brightness(0);
      }

      .copy {
        position: absolute;
        top: 168px;
        left: 64px;
        width: 620px;
      }

      .eyebrow {
        margin: 0 0 24px;
        font-size: 20px;
        font-weight: 450;
        line-height: 1.3;
        letter-spacing: -0.015em;
      }

      h1 {
        margin: 0;
        font-family: "Inter", "Geist", sans-serif;
        font-size: 96px;
        font-weight: 700;
        line-height: 1.02;
        letter-spacing: -0.06em;
      }

      h1 span { display: block; white-space: nowrap; }

      .launcher {
        position: absolute;
        top: 160px;
        right: 64px;
        display: block;
        width: 416px;
        height: 402px;
        box-shadow: 0 16px 40px rgba(8, 8, 8, 0.16);
      }

      .tools {
        position: absolute;
        left: 64px;
        bottom: 58px;
        margin: 0;
        color: #f4f4f2;
        font-size: 21px;
        font-weight: 450;
        line-height: 1.3;
        letter-spacing: -0.015em;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="lower-field" aria-hidden="true"></div>
      <header class="brand"><img src="../public/temoto-mark.svg" alt="" /><span>temoto</span></header>
      <section class="copy">
        <p class="eyebrow">A small toolkit for Chrome</p>
        <h1><span>Less friction.</span><span>More doing.</span></h1>
      </section>
      <img class="launcher" src="../public/showcase/chrome-launcher.png" width="416" height="402" alt="temoto's five tools: Color Picker, Screenshot, CSS, Video Speed, and Proxy" />
      <p class="tools">Color · Capture · CSS · Video · Proxy</p>
    </main>
  </body>
</html>
