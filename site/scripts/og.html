<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1200, initial-scale=1" />
  <title>temoto — Less friction. More doing.</title>
  <style>
    @font-face { font-family: "Geist"; src: url("../public/brand/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
    * { box-sizing: border-box; }
    html, body { color-scheme: light; width: 1200px; height: 630px; margin: 0; overflow: hidden; background: #fff; color: #202124; font-family: "Geist", sans-serif; -webkit-font-smoothing: antialiased; }
    main { position: relative; width: 1200px; height: 630px; padding: 48px 64px; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 24px; font-weight: 600; letter-spacing: -.035em; }
    .brand img { width: 32px; height: 32px; }
    .copy { position: absolute; left: 64px; top: 200px; }
    h1 { margin: 0; font-size: 70px; font-weight: 600; line-height: 1.08; letter-spacing: -.045em; }
    h1 span { display: block; }
    .description { max-width: 500px; margin: 26px 0 0; color: #5f6368; font-size: 18px; line-height: 1.5; }
    .stage { position: absolute; top: 112px; right: 64px; width: 490px; height: 460px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: #f1f3f4; }
    .launcher { display: block; width: 360px; height: auto; border: 1px solid #dadce0; border-radius: 8px; }
  </style>
</head>
<body>
  <main>
    <header class="brand"><img src="../public/temoto-mark.svg" alt="" /><span>temoto</span></header>
    <section class="copy">
      <h1><span>Less friction.</span><span>More doing.</span></h1>
      <p class="description">Color, capture, CSS, video, proxy. All close at hand.</p>
    </section>
    <div class="stage"><img class="launcher" src="../public/showcase/chrome-launcher.png" alt="temoto's five tools: Color Picker, Screenshot, CSS, Video Speed, and Proxy" /></div>
  </main>
</body>
</html>
