<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="frostedGlass" x1="340" y1="330" x2="690" y2="475" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="0.48" stop-color="#f5f6f4" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#dfe3e2" stop-opacity="0.62"/>
    </linearGradient>
    <linearGradient id="clearGlass" x1="340" y1="525" x2="690" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8ffff" stop-opacity="0.32"/>
      <stop offset="0.52" stop-color="#eaf2f2" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#d5dede" stop-opacity="0.26"/>
    </linearGradient>
    <linearGradient id="markHighlight" x1="320" y1="335" x2="680" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.58"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.26"/>
    </linearGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="26" stdDeviation="32" flood-color="#000" flood-opacity="0.64"/>
    </filter>
    <filter id="markShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="11" stdDeviation="11" flood-color="#000" flood-opacity="0.3"/>
      <feDropShadow dx="-1" dy="-2" stdDeviation="3" flood-color="#fff" flood-opacity="0.1"/>
    </filter>
  </defs>

  <g filter="url(#tileShadow)">
    <rect x="42" y="42" width="940" height="940" rx="244" fill="#1c1c1e" stroke="#5d5d60" stroke-width="12"/>
    <rect x="57" y="57" width="910" height="910" rx="229" fill="none" stroke="#fff" stroke-opacity="0.08" stroke-width="3"/>
  </g>

  <g transform="translate(512 512) scale(1.68) translate(-512 -512)" stroke-linejoin="round" filter="url(#markShadow)">
    <rect x="302" y="335" width="420" height="130" rx="65" transform="rotate(30 512 400)" fill="url(#frostedGlass)" stroke="#fff" stroke-opacity="0.62" stroke-width="7"/>
    <rect x="310" y="343" width="404" height="114" rx="57" transform="rotate(30 512 400)" fill="none" stroke="url(#markHighlight)" stroke-width="2"/>
    <rect x="302" y="535" width="420" height="130" rx="65" transform="rotate(30 512 600)" fill="url(#clearGlass)" stroke="#fff" stroke-opacity="0.45" stroke-width="5"/>
    <rect x="310" y="543" width="404" height="114" rx="57" transform="rotate(30 512 600)" fill="none" stroke="url(#markHighlight)" stroke-opacity="0.58" stroke-width="2"/>
  </g>
</svg>
