<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>temoto — B / Joint</title>
    <link rel="icon" href="b-joint.svg" type="image/svg+xml" />
    <style>
      @font-face { font-family: Geist; src: url("geist-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
      * { box-sizing: border-box; }
      :root { color-scheme: dark; font-family: Geist, system-ui, sans-serif; background: #080808; color: #f4f4f2; }
      body { margin: 0; }
      main { max-width: 1080px; margin: auto; padding: 32px; }
      header { display: flex; justify-content: space-between; align-items: baseline; gap: 20px; border-bottom: 1px solid #3c3c3b; padding-bottom: 20px; }
      h1 { margin: 0; font-size: 18px; font-weight: 600; }
      a { color: #bda5ff; text-underline-offset: 4px; }
      .hero { min-height: 330px; display: grid; place-content: center; gap: 18px; padding: 36px 0; }
      .lockup { display: flex; align-items: center; gap: 22px; }
      .wordmark { font-size: clamp(50px, 10vw, 100px); line-height: 1; font-weight: 750; letter-spacing: -.06em; }
      .lockup > img { width: clamp(70px, 15vw, 132px); height: auto; }
      .companion { justify-content: center; gap: 12px; }
      .companion > img { width: 38px; }
      .companion .wordmark { font-size: 29px; font-weight: 700; letter-spacing: -.045em; }
      .descriptor { color: #9974f8; font-weight: 550; }
      .samples { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid #3c3c3b; }
      .panel { padding: 28px; min-width: 0; }
      .light { background: #f4f4f2; color: #080808; color-scheme: light; }
      h2 { margin: 0 0 28px; font-size: 12px; font-weight: 500; letter-spacing: .06em; }
      .sizes { display: flex; justify-content: space-between; align-items: end; gap: 12px; }
      figure { margin: 0; display: grid; justify-items: center; gap: 14px; }
      .mark { display: block; width: var(--size); height: var(--size); background: #9974f8; mask: url("b-joint.svg") center / contain no-repeat; -webkit-mask: url("b-joint.svg") center / contain no-repeat; }
      .mono { background: currentColor; }
      figcaption { font: 11px/1.3 ui-monospace, monospace; opacity: .7; }
      .monochrome { display: flex; gap: 24px; margin-top: 32px; padding-top: 24px; border-top: 1px solid #3c3c3b; }
      .light .monochrome { border-color: #cdcdca; }
      footer { margin-top: 22px; font-size: 12px; line-height: 1.7; color: #a2a2a0; }
      footer p { margin: 0 0 6px; }
      @media (max-width: 640px) { main { padding: 20px; } .samples { grid-template-columns: 1fr; } .hero { min-height: 270px; } .lockup { gap: 12px; } .panel { padding: 24px; } }
    </style>
  </head>
  <body>
    <main>
      <header><h1>B / Joint — SVG</h1><a href="b-joint.svg" download="temoto-joint.svg">SVGを保存</a></header>
      <section class="hero" aria-label="ロゴの組み合わせ例">
        <div class="lockup"><img src="b-joint.svg" alt="Bのマーク" /><span class="wordmark">temoto</span></div>
        <div class="lockup companion"><img src="b-joint.svg" alt="" /><span class="wordmark">temoto <span class="descriptor">Proxy</span></span></div>
      </section>
      <section class="samples" aria-label="背景色とサイズの確認">
        <div class="panel">
          <h2>DARK / PURPLE + WHITE</h2>
          <div class="sizes">
            <figure><span class="mark" style="--size:16px" aria-hidden="true"></span><figcaption>16 px</figcaption></figure>
            <figure><span class="mark" style="--size:24px" aria-hidden="true"></span><figcaption>24 px</figcaption></figure>
            <figure><span class="mark" style="--size:32px" aria-hidden="true"></span><figcaption>32 px</figcaption></figure>
            <figure><span class="mark" style="--size:48px" aria-hidden="true"></span><figcaption>48 px</figcaption></figure>
            <figure><span class="mark" style="--size:64px" aria-hidden="true"></span><figcaption>64 px</figcaption></figure>
          </div>
          <div class="monochrome" aria-label="白の単色表示"><span class="mark mono" style="--size:16px"></span><span class="mark mono" style="--size:32px"></span><span class="mark mono" style="--size:48px"></span></div>
        </div>
        <div class="panel light">
          <h2>LIGHT / PURPLE + BLACK</h2>
          <div class="sizes">
            <figure><span class="mark" style="--size:16px" aria-hidden="true"></span><figcaption>16 px</figcaption></figure>
            <figure><span class="mark" style="--size:24px" aria-hidden="true"></span><figcaption>24 px</figcaption></figure>
            <figure><span class="mark" style="--size:32px" aria-hidden="true"></span><figcaption>32 px</figcaption></figure>
            <figure><span class="mark" style="--size:48px" aria-hidden="true"></span><figcaption>48 px</figcaption></figure>
            <figure><span class="mark" style="--size:64px" aria-hidden="true"></span><figcaption>64 px</figcaption></figure>
          </div>
          <div class="monochrome" aria-label="黒の単色表示"><span class="mark mono" style="--size:16px"></span><span class="mark mono" style="--size:32px"></span><span class="mark mono" style="--size:48px"></span></div>
        </div>
      </section>
      <footer><p>マークはSVG。斜めの切れ目は30°、2つの図形は同じ角度で揃えています。</p><p>採用前の検討記録です。文字はGeistを合わせた例で、生成ラフのトレースではありません。現在の実装は通常版が塗り、Proxyが中抜きです。</p></footer>
    </main>
  </body>
</html>
