<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>temoto Proxy — Profiles</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="manager.css" />
  </head>
  <body class="manager-page">
    <main class="manager-shell">
      <header class="manager-header product-header">
        <div class="brand" translate="no">temoto <span>Proxy</span></div>
        <div class="manager-global-state" aria-live="polite"><i id="manager-status-dot"></i><span id="manager-status">Reading Chrome settings…</span></div>
        <button class="button secondary" id="global-toggle" type="button" disabled>Loading…</button>
      </header>

      <aside class="manager-sidebar">
        <div class="sidebar-heading"><span>Profiles</span><button id="new-profile" type="button" aria-label="New profile">＋</button></div>
        <nav id="manager-profile-list" aria-label="Proxy profiles"></nav>
        <div class="sidebar-tools">
          <button id="import-profiles" type="button">Import</button>
          <button id="export-profiles" type="button">Export</button>
          <input id="import-file" type="file" accept="application/json,.json" hidden />
        </div>
      </aside>

      <section class="manager-content">
        <div class="manager-notice" id="manager-notice" role="status" hidden></div>
        <div class="action-result" id="manager-result" role="alert" hidden></div>
        <div class="empty-manager" id="empty-manager" hidden>
          <button class="button primary" id="empty-create" type="button">New profile</button>
        </div>

        <form id="profile-form" novalidate hidden>
          <div class="editor-titlebar">
            <h1 id="editor-title">Proxy profile</h1>
            <div class="editor-title-actions">
              <button class="button secondary" id="duplicate-profile" type="button">Duplicate</button>
              <button class="button secondary" id="delete-profile" type="button">Delete</button>
            </div>
          </div>

          <section class="profile-identity">
            <div class="form-grid">
              <label class="field"><span>Profile name</span><input name="name" maxlength="80" required /></label>
            </div>
            <div class="segmented" role="group" aria-label="Profile type">
              <label><input type="radio" name="kind" value="fixed" checked /><span>Fixed proxy</span></label>
              <label><input type="radio" name="kind" value="rules" /><span>Domain routing</span></label>
              <label><input type="radio" name="kind" value="pac" /><span>PAC</span></label>
            </div>
          </section>

          <section class="connection-section" id="fixed-section">
            <div class="connection-heading"><h2>Proxy servers</h2>
              <label class="inline-choice protocol-choice"><span>Use protocol-specific proxies</span><input type="checkbox" name="perProtocol" /></label>
            </div>
            <div id="single-endpoint" class="endpoint-block">
              <div class="endpoint-grid" data-endpoint="single"></div>
            </div>
            <div id="protocol-endpoints" class="protocol-endpoints" hidden>
              <div class="endpoint-block"><h3>HTTP requests</h3><div class="endpoint-grid" data-endpoint="http"></div></div>
              <div class="endpoint-block"><h3>HTTPS requests</h3><div class="endpoint-grid" data-endpoint="https"></div></div>
              <div class="endpoint-block"><h3>Fallback</h3><div class="endpoint-grid" data-endpoint="fallback"></div></div>
            </div>
          </section>

          <section class="connection-section" id="routing-section" hidden>
            <div class="section-intro"><h2>Routing rules</h2></div>
            <div class="routing-default">
              <span>When no rule matches</span>
              <select name="defaultAction"><option value="proxy">Use proxy</option><option value="direct">Connect directly</option></select>
            </div>
            <div class="rule-list" id="rule-list"></div>
            <button class="row-add" id="add-rule" type="button">＋ Add domain rule</button>
          </section>

          <section class="connection-section" id="pac-section" hidden>
            <div class="section-intro"><h2>PAC</h2></div>
            <div class="form-grid two-columns">
              <label class="field"><span>Source</span><select name="pacSource"><option value="inline">Inline script</option><option value="url">PAC URL</option></select></label>
              <label class="inline-choice compact"><input type="checkbox" name="pacMandatory" /><span><strong>Block direct fallback</strong></span></label>
            </div>
            <label class="field"><span id="pac-value-label">PAC script</span><textarea name="pacValue" rows="9" spellcheck="false"></textarea></label>
          </section>

          <details class="settings-section" id="bypass-section">
            <summary><span><strong>Direct connections</strong></span></summary>
            <label class="field"><span>Bypass list · one per line</span><textarea name="bypassList" rows="5" spellcheck="false" placeholder="&lt;local&gt;&#10;localhost&#10;*.internal.test"></textarea></label>
          </details>

          <details class="settings-section" id="authentication-section">
            <summary><span><strong>Authentication</strong></span></summary>
            <label class="inline-choice"><input type="checkbox" name="authEnabled" /><span><strong>Proxy authentication</strong></span></label>
            <div id="auth-fields" class="form-grid auth-grid" hidden>
              <label class="field"><span>Username</span><input name="username" autocomplete="username" /></label>
              <label class="field"><span>Session password</span><input name="password" type="password" autocomplete="current-password" placeholder="Password" /></label>
              <label class="field full-span"><span>Allowed proxy hosts · one per line</span><textarea name="authHosts" rows="3" spellcheck="false" placeholder="proxy.example.com"></textarea></label>
              <div class="credential-state full-span" id="credential-state"></div>
            </div>
          </details>

          <details class="settings-section" id="connection-test-section">
            <summary><span><strong>Connection test</strong></span></summary>
            <div class="diagnostic-row">
              <label class="field"><span>Test URL</span><input name="diagnosticUrl" type="url" placeholder="https://example.com/" /></label>
              <button class="button secondary" id="run-diagnostic" type="button">Save & test</button>
            </div>
            <div class="diagnostic-result" id="diagnostic-result" role="status" hidden></div>
          </details>

          <details class="settings-section global-settings">
            <summary><span><strong>Incognito</strong></span></summary>
            <label class="inline-choice"><input type="checkbox" id="incognito-enabled" /><span><strong>Apply active profile in incognito</strong></span></label>
            <p class="permission-state" id="incognito-help" hidden></p>
            <label class="inline-choice compact" id="incognito-session-row" hidden><input type="checkbox" id="incognito-session" checked /><span><strong>Session only</strong></span></label>
          </details>

          <footer class="editor-footer">
            <div>
              <button class="button secondary" id="activate-profile" type="button">Save & activate</button>
              <button class="button primary" id="save-profile" type="submit">Save</button>
            </div>
          </footer>
        </form>
      </section>
    </main>
    <script type="module" src="manager.js"></script>
  </body>
</html>
