<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, initial-scale=1" />
    <title>temoto for Chrome — Small promo</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
      body {
        color: #f5f3f0;
        background:
          radial-gradient(circle at 84% 18%, rgba(140, 120, 166, .22), transparent 42%),
          linear-gradient(145deg, #090909, #121015);
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { width: 440px; height: 280px; padding: 30px 34px; display: flex; flex-direction: column; justify-content: space-between; }
      .brand { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600; letter-spacing: -.02em; }
      .brand img { width: 18px; height: 20px; }
      .brand span { color: #9b86b6; }
      h1 { margin: 0; max-width: 330px; font-size: 38px; line-height: 1.03; letter-spacing: -.05em; font-weight: 520; }
      p { margin: 0; color: #9e9aa2; font-size: 14px; letter-spacing: -.01em; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand"><img src="/icons/temoto-mark.svg" alt="" />temoto <span>for Chrome</span></div>
      <h1>Developer tools, close at hand.</h1>
      <p>Color · Capture · Video · Environments · Inspect</p>
    </main>
  </body>
</html>
