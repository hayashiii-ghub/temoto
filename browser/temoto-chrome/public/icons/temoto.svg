<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="180" y1="120" x2="840" y2="930" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#303030"/>
      <stop offset="0.52" stop-color="#242424"/>
      <stop offset="1" stop-color="#181818"/>
    </linearGradient>
    <linearGradient id="edge" x1="220" y1="70" x2="800" y2="970" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#747472"/>
      <stop offset="0.45" stop-color="#4b4b49"/>
      <stop offset="1" stop-color="#292927"/>
    </linearGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="26" stdDeviation="32" flood-color="#000" flood-opacity="0.64"/>
    </filter>
    <filter id="markShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.34"/>
    </filter>
  </defs>

  <g filter="url(#tileShadow)">
    <rect x="18" y="18" width="988" height="988" rx="256" fill="url(#tile)"/>
  </g>

  <g transform="translate(512 512) scale(1.68) translate(-512 -512)" fill="#9974f8" filter="url(#markShadow)">
    <rect x="302" y="335" width="420" height="130" transform="rotate(30 512 400)"/>
    <rect x="302" y="535" width="420" height="130" transform="rotate(30 512 600)"/>
  </g>
</svg>
