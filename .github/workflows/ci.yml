name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and validate scripts
        run: make check

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        run: npm ci

      - name: Lint site
        run: npm run lint

      - name: Test site
        run: npm test

  chrome:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser/temoto-chrome

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: browser/temoto-chrome/package-lock.json

      - name: Install Chrome extension dependencies
        run: npm ci

      - name: Test Chrome extension
        run: npm test

      - name: Build Chrome extension
        run: npm run build

      - name: Test Chrome extension Sites build
        run: npm run test:sites
