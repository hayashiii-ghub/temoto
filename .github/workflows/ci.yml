name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install site dependencies
        run: bun install --frozen-lockfile

      - name: Audit site dependencies
        run: bun audit --audit-level=high

      - name: Check site
        run: bun run check

      - name: Test site
        run: bun run test

  chrome:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser/temoto-chrome

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: browser/temoto-chrome/package-lock.json

      - name: Install Chrome extension dependencies
        run: npm ci

      - name: Build Chrome extension
        run: npm run build

      - name: Test Chrome extension
        run: npm run test:unit

      - name: Test Chrome extension Sites build
        run: npm run test:sites

  proxy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser/temoto-proxy

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: browser/temoto-proxy/package-lock.json

      - name: Install Proxy extension dependencies
        run: npm ci

      - name: Check Proxy extension
        run: npm run check
