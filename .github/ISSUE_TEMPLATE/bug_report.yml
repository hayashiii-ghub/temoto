name: バグ報告
description: 再現可能な不具合を報告する
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        報告ありがとうございます。個人情報、アクセストークン、プロキシ認証情報を含めないでください。
  - type: dropdown
    id: product
    attributes:
      label: 製品
      options:
        - temoto for Chrome
        - temoto Proxy
        - Webサイト
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: バージョン
      placeholder: "例: 0.2.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 環境
      placeholder: "例: Chrome 140 / macOS 26、Chrome 140 / Windows 11"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: 最小限の手順を番号付きで記載してください。
      placeholder: |
        1. 拡張を開く
        2. …を選ぶ
        3. …が発生する
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待した動作
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の動作
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: 補足情報
      description: 必要に応じてログやスクリーンショットを添付してください。
  - type: checkboxes
    id: checks
    attributes:
      label: 確認事項
      options:
        - label: 最新リリースでも再現しました
          required: true
        - label: 機密情報を含めていません
          required: true
        - label: セキュリティ上の問題ではありません
          required: true
