version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/site"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 3
    groups:
      react:
        applies-to: version-updates
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types: ["minor", "patch"]
      # Bunはdependency-typeの公式対応外のため、devDependencies追加時はこの一覧も更新する。
      development:
        applies-to: version-updates
        patterns:
          - "@types/bun"
          - "cf"
          - "typescript"
          - "wrangler"
        update-types: ["minor", "patch"]
      production:
        applies-to: version-updates
        patterns:
          - "*"
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directories:
      - "/browser/temoto-chrome"
      - "/browser/temoto-proxy"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 3
    groups:
      react:
        applies-to: version-updates
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types: ["minor", "patch"]
      development:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - "*"
        update-types: ["minor", "patch"]
      production:
        applies-to: version-updates
        dependency-type: production
        patterns:
          - "*"
        update-types: ["minor", "patch"]
      security-updates:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
